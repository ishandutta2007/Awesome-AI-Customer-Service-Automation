<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-orbit {
        animation: rotateOrb 18s linear infinite;
        transform-origin: 1040px 180px;
      }
      .flow-dash {
        stroke-dasharray: 8 12;
        animation: dash 25s linear infinite;
      }
      .flow-dash-fast {
        stroke-dasharray: 6 10;
        animation: dashFast 14s linear infinite;
      }
      .card-float-1 {
        animation: floatY1 5s ease-in-out infinite alternate;
      }
      .card-float-2 {
        animation: floatY2 6s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dashFast {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes floatY1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatY2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(9px); }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
        100% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.7)); }
      }
      @keyframes rotateOrb {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16" />

  <!-- Dynamic Animated Tech Grid & Stream Backdrops (Background Layer Only) -->
  <g opacity="0.15">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Glowing Ambient Lights in Corners / Sides -->
  <circle cx="1040" cy="180" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="glow-pulse" />
  <circle cx="200" cy="80" r="100" fill="#0ea5e9" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Data Streams & Connecting Lines (Right Side Background) -->
  <g opacity="0.45">
    <path class="flow-dash" d="M 780 70 Q 890 20 1020 90 T 1160 170" fill="none" stroke="url(#stream-cyan)" stroke-width="2.5" />
    <path class="flow-dash-fast" d="M 750 280 Q 880 330 1010 260 T 1150 180" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="flow-dash" d="M 830 180 L 1000 180" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Subtle Dynamic Tech Nodes & Floating Pills on Right Side (Decorations) -->
  <g class="card-float-1" transform="translate(0, 0)">
    <!-- Metric Floating Pill 1 -->
    <rect x="850" y="65" width="230" height="52" rx="26" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1" opacity="0.88" />
    <circle cx="876" cy="91" r="10" fill="#38bdf8" opacity="0.2" />
    <circle cx="876" cy="91" r="5" fill="#38bdf8" />
    <text x="898" y="96" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Autonomous Resolution: 85%+</text>
  </g>

  <g class="card-float-2" transform="translate(0, 0)">
    <!-- Metric Floating Pill 2 -->
    <rect x="880" y="240" width="220" height="52" rx="26" fill="url(#badge-grad)" stroke="#a855f7" stroke-width="1" opacity="0.88" />
    <circle cx="906" cy="266" r="10" fill="#a855f7" opacity="0.2" />
    <circle cx="906" cy="266" r="5" fill="#c084fc" />
    <text x="928" y="271" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Omnichannel &amp; RAG Agents</text>
  </g>

  <!-- Central Dynamic Agent Core (Right Accent) -->
  <g transform="translate(1040, 180)">
    <!-- Rotating Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" class="node-orbit" />
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="2" filter="url(#soft-glow)" />
    <!-- Bot / Audio Wave Icon inside Orb -->
    <path d="M -10 -6 L -10 6 M -5 -11 L -5 11 M 0 -15 L 0 15 M 5 -11 L 5 11 M 10 -6 L 10 6" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header Titles, Tags & Subtitles (Crisp, High Contrast, Guaranteed Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" class="badge-glow" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED INTELLIGENCE ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient Fill + Subtle Drop Shadow) -->
    <text x="0" y="142" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome AI Customer Service
    </text>
    <text x="0" y="194" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Automation &amp; Support Agents 🎧 🤖
    </text>

    <!-- Subtitle / Value Proposition Description -->
    <text x="0" y="242" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS Platforms • Self-Hosted Open-Source Frameworks • Outcome-Based AI Copilots
    </text>

    <!-- Interactive Badges in Banner -->
    <g transform="translate(0, 276)">
      <!-- Badge 1: 2026 Edition -->
      <rect x="0" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">📅 2026 Edition</text>

      <!-- Badge 2: Commercial Leaders -->
      <rect x="135" y="0" width="168" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="147" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🏢 Commercial Giants</text>

      <!-- Badge 3: Open-Source -->
      <rect x="313" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="325" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">🔓 Self-Hosted Stars</text>

      <!-- Badge 4: Outcome Pricing -->
      <rect x="483" y="0" width="180" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="495" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">⚡ Outcome-Based ROI</text>
    </g>
  </g>
</svg>
